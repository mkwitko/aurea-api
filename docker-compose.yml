# Local development infrastructure (Postgres + Redis).
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aurea
      POSTGRES_PASSWORD: aurea
      POSTGRES_DB: aurea
    ports:
      - '5434:5432'
    volumes:
      - aurea_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurea']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6380:6379'
    volumes:
      - aurea_redis:/data

  # Langfuse (tracing dos runs de IA). Reaproveita o postgres e o redis acima;
  # só ClickHouse e MinIO são novos. UI em http://localhost:3050
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.12
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8123/ping || exit 1']
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-minio:
    image: minio/minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - langfuse_minio:/data

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    depends_on:
      postgres: {condition: service_healthy}
      langfuse-clickhouse: {condition: service_healthy}
      langfuse-minio: {condition: service_started}
      redis: {condition: service_started}
    environment: &langfuse-env
      DATABASE_URL: postgresql://aurea:aurea@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env}
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto

  langfuse-web:
    image: langfuse/langfuse:3
    depends_on:
      langfuse-worker: {condition: service_started}
    ports:
      - '3050:3000'
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3050
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
      TELEMETRY_ENABLED: 'false'
      LANGFUSE_INIT_ORG_ID: aurea
      LANGFUSE_INIT_ORG_NAME: AUREA
      LANGFUSE_INIT_PROJECT_ID: aurea-dev
      LANGFUSE_INIT_PROJECT_NAME: AUREA local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-aurea-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-aurea-local
      LANGFUSE_INIT_USER_EMAIL: dev@aurea.local
      LANGFUSE_INIT_USER_NAME: Dev
      LANGFUSE_INIT_USER_PASSWORD: aurealocal123

volumes:
  aurea_pg:
  aurea_redis:
  langfuse_clickhouse:
  langfuse_minio:
